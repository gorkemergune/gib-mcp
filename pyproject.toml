[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gib-mcp"
version = "0.1.0"
description = "GIB ozelge discovery and MCP starter"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "playwright>=1.50,<2"]

[project.scripts]
gib-mcp = "gib_mcp.server:main"
gib-discover = "gib_mcp.discovery:main"

[tool.setuptools.packages.find]
where = ["src"]
